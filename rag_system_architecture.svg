<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #263238; }
      .label { font: 700 24px Arial, sans-serif; }
      .sub { font: 19px Arial, sans-serif; }
      .edge { font: 17px Arial, sans-serif; fill: #455a64; }
      .box { stroke-width: 2.5; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#607d8b"/>
    </marker>
    <marker id="arrowBack" markerWidth="10" markerHeight="10" refX="1" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M9,0 L9,6 L0,3 z" fill="#607d8b"/>
    </marker>
  </defs>

  <rect width="1600" height="1000" fill="#ffffff"/>
  <text x="800" y="48" text-anchor="middle" class="title">LOTUSMILE SYSTEM ARCHITECTURE WITH HYBRID RAG</text>

  <rect x="250" y="85" width="1100" height="830" rx="28" fill="#fbfcfd" stroke="#b0bec5" stroke-width="3" stroke-dasharray="12 10"/>
  <text x="800" y="120" text-anchor="middle" class="sub" fill="#607d8b">Docker Compose network</text>

  <rect class="box" x="25" y="390" width="190" height="130" rx="18" fill="#e3f2fd" stroke="#64b5f6"/>
  <text x="120" y="437" text-anchor="middle" class="label" fill="#1565c0">Client</text>
  <text x="120" y="472" text-anchor="middle" class="sub" fill="#1565c0">Browser / Mobile</text>

  <rect class="box" x="290" y="390" width="210" height="130" rx="18" fill="#e0f2f1" stroke="#4db6ac"/>
  <text x="395" y="437" text-anchor="middle" class="label" fill="#00695c">Nginx</text>
  <text x="395" y="472" text-anchor="middle" class="sub" fill="#00796b">Reverse proxy</text>

  <rect class="box" x="595" y="330" width="300" height="250" rx="20" fill="#ede7f6" stroke="#9575cd"/>
  <text x="745" y="378" text-anchor="middle" class="label" fill="#4527a0">Laravel App</text>
  <text x="745" y="414" text-anchor="middle" class="sub" fill="#5e35b1">PHP backend / API</text>
  <text x="745" y="449" text-anchor="middle" class="sub" fill="#5e35b1">Auth · Booking · Payment</text>
  <text x="745" y="484" text-anchor="middle" class="sub" fill="#5e35b1">ChatbotController</text>
  <text x="745" y="519" text-anchor="middle" class="sub" fill="#5e35b1">HybridTourRetriever · RRF</text>
  <text x="745" y="554" text-anchor="middle" class="sub" fill="#5e35b1">SQL fallback</text>

  <rect class="box" x="560" y="690" width="275" height="145" rx="18" fill="#fbe9e7" stroke="#ff8a65"/>
  <text x="697" y="735" text-anchor="middle" class="label" fill="#bf360c">Flask AI Service</text>
  <text x="697" y="772" text-anchor="middle" class="sub" fill="#d84315">TF-IDF · Cosine Similarity</text>
  <text x="697" y="807" text-anchor="middle" class="sub" fill="#d84315">Recommendation API</text>

  <rect class="box" x="1030" y="260" width="250" height="140" rx="18" fill="#fff8e1" stroke="#ffca28"/>
  <text x="1155" y="307" text-anchor="middle" class="label" fill="#8d6e00">MySQL</text>
  <text x="1155" y="343" text-anchor="middle" class="sub" fill="#8d6e00">Authoritative data</text>
  <text x="1155" y="375" text-anchor="middle" class="sub" fill="#8d6e00">Tours · Users · Bookings</text>

  <rect class="box" x="1030" y="510" width="250" height="140" rx="18" fill="#e8f5e9" stroke="#66bb6a"/>
  <text x="1155" y="557" text-anchor="middle" class="label" fill="#2e7d32">Qdrant</text>
  <text x="1155" y="593" text-anchor="middle" class="sub" fill="#388e3c">Tour vector index</text>
  <text x="1155" y="625" text-anchor="middle" class="sub" fill="#388e3c">Cosine similarity search</text>

  <rect class="box" x="1390" y="170" width="185" height="145" rx="18" fill="#e8eaf6" stroke="#7986cb"/>
  <text x="1482" y="217" text-anchor="middle" class="label" fill="#303f9f">Cohere API</text>
  <text x="1482" y="253" text-anchor="middle" class="sub" fill="#3f51b5">Embeddings</text>
  <text x="1482" y="284" text-anchor="middle" class="sub" fill="#3f51b5">Grounded chat</text>

  <rect class="box" x="1390" y="430" width="185" height="140" rx="18" fill="#f1f8e9" stroke="#9ccc65"/>
  <text x="1482" y="476" text-anchor="middle" class="label" fill="#558b2f">Payment GW</text>
  <text x="1482" y="512" text-anchor="middle" class="sub" fill="#689f38">VNPay · ZaloPay</text>
  <text x="1482" y="543" text-anchor="middle" class="sub" fill="#689f38">External service</text>

  <rect class="box" x="1030" y="745" width="250" height="110" rx="18" fill="#fff3e0" stroke="#ffb74d"/>
  <text x="1155" y="790" text-anchor="middle" class="label" fill="#e65100">Ngrok Tunnel</text>
  <text x="1155" y="825" text-anchor="middle" class="sub" fill="#ef6c00">Development IPN callback</text>

  <line x1="215" y1="455" x2="290" y2="455" stroke="#607d8b" stroke-width="3" marker-start="url(#arrowBack)" marker-end="url(#arrow)"/>
  <text x="252" y="440" text-anchor="middle" class="edge">HTTP</text>

  <line x1="500" y1="455" x2="595" y2="455" stroke="#607d8b" stroke-width="3" marker-start="url(#arrowBack)" marker-end="url(#arrow)"/>
  <text x="548" y="440" text-anchor="middle" class="edge">REST / AJAX</text>

  <path d="M895 395 C955 395, 970 330, 1030 330" fill="none" stroke="#607d8b" stroke-width="3" marker-start="url(#arrowBack)" marker-end="url(#arrow)"/>
  <text x="958" y="352" text-anchor="middle" class="edge">SQL + catalog facts</text>

  <path d="M895 520 C960 520, 970 580, 1030 580" fill="none" stroke="#607d8b" stroke-width="3" marker-start="url(#arrowBack)" marker-end="url(#arrow)"/>
  <text x="960" y="558" text-anchor="middle" class="edge">Vector search REST</text>

  <line x1="697" y1="580" x2="697" y2="690" stroke="#607d8b" stroke-width="3" marker-start="url(#arrowBack)" marker-end="url(#arrow)"/>
  <text x="715" y="642" class="edge">Recommendation REST API</text>

  <path d="M895 350 C1070 155, 1255 145, 1390 235" fill="none" stroke="#607d8b" stroke-width="3" marker-start="url(#arrowBack)" marker-end="url(#arrow)"/>
  <text x="1165" y="157" text-anchor="middle" class="edge">HTTPS: Embed query / Grounded chat</text>

  <path d="M895 555 C955 650, 1010 735, 1060 760" fill="none" stroke="#607d8b" stroke-width="3" marker-start="url(#arrowBack)" marker-end="url(#arrow)"/>
  <text x="935" y="687" text-anchor="middle" class="edge">IPN callback</text>

  <path d="M1280 800 C1370 770, 1415 650, 1460 570" fill="none" stroke="#607d8b" stroke-width="3" marker-start="url(#arrowBack)" marker-end="url(#arrow)"/>
  <text x="1400" y="715" text-anchor="middle" class="edge">IPN / redirect</text>

  <rect x="30" y="865" width="185" height="95" rx="12" fill="#fafafa" stroke="#cfd8dc"/>
  <text x="50" y="895" class="sub" fill="#455a64">Legend</text>
  <rect x="50" y="913" width="18" height="18" fill="#ede7f6" stroke="#9575cd"/>
  <text x="78" y="928" class="edge">Internal service</text>
  <rect x="50" y="940" width="18" height="18" fill="#e8eaf6" stroke="#7986cb"/>
  <text x="78" y="955" class="edge">External service</text>
</svg>
